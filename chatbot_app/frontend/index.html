<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedBot AI - Assistant Médical Vocal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --accent-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --warning-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      --error-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.15);
      --shadow-xl: 0 35px 60px rgba(0, 0, 0, 0.2);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--primary-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Enhanced Background Effects */
    .background-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }

    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      pointer-events: none;
      animation: particleFloat 8s linear infinite;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) translateX(100px) scale(1);
        opacity: 0;
      }
    }

    .floating-shape {
      position: absolute;
      background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
      backdrop-filter: blur(2px);
    }

    .shape-1 {
      width: 120px;
      height: 120px;
      top: 15%;
      left: 8%;
      animation-delay: -2s;
    }

    .shape-2 {
      width: 80px;
      height: 80px;
      top: 70%;
      right: 12%;
      animation-delay: -4s;
    }

    .shape-3 {
      width: 150px;
      height: 150px;
      bottom: 25%;
      left: 15%;
      animation-delay: -1s;
    }

    .shape-4 {
      width: 60px;
      height: 60px;
      top: 40%;
      right: 25%;
      animation-delay: -3s;
    }

    @keyframes float {
      0%, 100% { 
        transform: translateY(0px) translateX(0px) rotate(0deg); 
        opacity: 0.7;
      }
      33% { 
        transform: translateY(-20px) translateX(15px) rotate(120deg); 
        opacity: 1;
      }
      66% { 
        transform: translateY(15px) translateX(-10px) rotate(240deg); 
        opacity: 0.8;
      }
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 50px 40px;
      width: 100%;
      max-width: 600px;
      text-align: center;
      box-shadow: var(--shadow-xl);
      animation: slideIn 1s ease-out;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Header Section */
    .header {
      margin-bottom: 40px;
      position: relative;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: var(--accent-gradient);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 20px;
      box-shadow: var(--shadow-lg);
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    .title {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      background: linear-gradient(135deg, #ffffff, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 400;
      line-height: 1.6;
    }

    /* Voice Controls */
    .voice-controls {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .btn {
      position: relative;
      padding: 18px 36px;
      border: none;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
      justify-content: center;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-icon {
      font-size: 1.3rem;
      transition: transform 0.3s ease;
    }

    .btn:hover .btn-icon {
      transform: scale(1.2);
    }

    .btn-record {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52, #ff8a80);
      color: white;
      box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
    }

    .btn-record:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 40px rgba(255, 107, 107, 0.6);
    }

    .btn-record:active:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
    }

    .btn-stop {
      background: linear-gradient(135deg, #4ecdc4, #44a08d, #26d0ce);
      color: white;
      box-shadow: 0 15px 35px rgba(78, 205, 196, 0.4);
    }

    .btn-stop:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 40px rgba(78, 205, 196, 0.6);
    }

    .btn:disabled {
      opacity: 0.5;
      transform: none !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Status Section */
    .status-section {
      margin-bottom: 40px;
    }

    .status-container {
      position: relative;
      margin-bottom: 20px;
    }

    .status {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 500;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
      text-align: center;
      line-height: 1.5;
    }

    .status.recording {
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 138, 128, 0.15));
      border-color: rgba(255, 107, 107, 0.4);
      animation: statusPulse 2s infinite;
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
    }

    .status.processing {
      background: linear-gradient(135deg, rgba(255, 193, 7, 0.2), rgba(252, 182, 159, 0.15));
      border-color: rgba(255, 193, 7, 0.4);
      animation: processingShimmer 1.5s infinite;
    }

    .status.success {
      background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.15));
      border-color: rgba(79, 172, 254, 0.4);
      box-shadow: 0 0 25px rgba(79, 172, 254, 0.3);
    }

    .status.error {
      background: linear-gradient(135deg, rgba(255, 154, 158, 0.2), rgba(254, 207, 239, 0.15));
      border-color: rgba(255, 154, 158, 0.4);
      animation: errorShake 0.5s ease-in-out;
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.9; }
    }

    @keyframes processingShimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }

    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Enhanced Wave Animation */
    .wave-animation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 15px 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      height: 40px;
    }

    .wave-animation.active {
      opacity: 1;
    }

    .wave-bar {
      width: 4px;
      height: 15px;
      background: linear-gradient(to top, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4));
      border-radius: 3px;
      animation: wave 1.2s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }
    .wave-bar:nth-child(6) { animation-delay: 0.2s; }
    .wave-bar:nth-child(7) { animation-delay: 0.1s; }

    @keyframes wave {
      0%, 100% { 
        height: 15px; 
        opacity: 0.7; 
      }
      50% { 
        height: 35px; 
        opacity: 1; 
      }
    }

    /* Audio Player */
    .audio-player {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: var(--shadow-lg);
    }

    .audio-player.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .audio-player-header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .audio-player audio {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Recording Indicator */
    .recording-indicator {
      position: fixed;
      top: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 107, 107, 0.2);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 25px;
      padding: 12px 20px;
      color: white;
      font-weight: 500;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.4s ease;
      z-index: 1000;
    }

    .recording-indicator.active {
      opacity: 1;
      transform: translateX(0);
    }

    .recording-dot {
      width: 12px;
      height: 12px;
      background: #ff6b6b;
      border-radius: 50%;
      animation: recordingBlink 1s infinite;
    }

    @keyframes recordingBlink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }

    /* Connection Status */
    .connection-status {
      position: fixed;
      bottom: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 10px 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 1000;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ecdc4;
      animation: connectionPulse 2s infinite;
    }

    .connection-dot.offline {
      background: #ff6b6b;
      animation: none;
    }

    @keyframes connectionPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 40px 25px;
        margin: 10px;
        border-radius: 24px;
      }
      
      .voice-controls {
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      
      .btn {
        width: 100%;
        max-width: 280px;
      }
      
      .title {
        font-size: 2.2rem;
      }

      .logo {
        width: 60px;
        height: 60px;
        font-size: 2rem;
      }

      .recording-indicator {
        top: 20px;
        right: 20px;
        padding: 10px 16px;
        font-size: 0.85rem;
      }

      .connection-status {
        bottom: 20px;
        left: 20px;
        padding: 8px 12px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }
      
      .title {
        font-size: 1.9rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .btn {
        padding: 16px 28px;
        font-size: 1rem;
      }
    }

    /* Loading Animation */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }

    .loading-dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      animation: loadingBounce 1.4s infinite ease-in-out;
    }

    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes loadingBounce {
      0%, 80%, 100% { 
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Accessibility Improvements */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Background Effects -->
  <div class="background-effects">
    <div class="particles" id="particles"></div>
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
    <div class="floating-shape shape-4"></div>
  </div>

  <!-- Recording Indicator -->
  <div class="recording-indicator" id="recordingIndicator">
    <div class="recording-dot"></div>
    <span>En cours d'enregistrement</span>
  </div>

  <!-- Connection Status -->
  <div class="connection-status" id="connectionStatus">
    <div class="connection-dot" id="connectionDot"></div>
    <span id="connectionText">Connecté au serveur</span>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="container">
      <div class="header">
        <div class="logo">🏥</div>
        <h1 class="title">KONDAL HEALTH AI</h1>
        <p class="subtitle">Votre assistant médical vocal intelligent alimenté par l'IA</p>
      </div>

      <div class="voice-controls">
        <button class="btn btn-record" id="startBtn" aria-label="Commencer l'enregistrement vocal">
          <span class="btn-icon">🎙️</span>
          <span>Parler</span>
        </button>
        <button class="btn btn-stop" id="stopBtn" disabled aria-label="Arrêter l'enregistrement">
          <span class="btn-icon">⏹️</span>
          <span>Arrêter</span>
        </button>
      </div>

      <div class="status-section">
        <div class="status-container">
          <div class="status" id="status" role="status" aria-live="polite">
            Appuyez sur "Parler" pour commencer votre consultation médicale
          </div>
          <div class="wave-animation" id="waveAnimation" aria-hidden="true">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>
        </div>
      </div>

      <div class="audio-player" id="audioSection">
        <div class="audio-player-header">
          <span>🔊</span>
          <span>Réponse du MedBot</span>
        </div>
        <audio id="audioPlayer" controls preload="none" aria-label="Lecture de la réponse audio du chatbot médical"></audio>
      </div>
    </div>
  </div>

  <script>
    class MedBotVoiceInterface {
      constructor() {
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.isConnected = true;
        this.isRecording = false;
        this.audioStream = null;
        
        this.initElements();
        this.initEventListeners();
        this.initParticles();
        this.checkConnection();
      }

      initElements() {
        this.startBtn = document.getElementById("startBtn");
        this.stopBtn = document.getElementById("stopBtn");
        this.statusElement = document.getElementById("status");
        this.audioPlayer = document.getElementById("audioPlayer");
        this.audioSection = document.getElementById("audioSection");
        this.recordingIndicator = document.getElementById("recordingIndicator");
        this.waveAnimation = document.getElementById("waveAnimation");
        this.connectionStatus = document.getElementById("connectionStatus");
        this.connectionDot = document.getElementById("connectionDot");
        this.connectionText = document.getElementById("connectionText");
      }

      initEventListeners() {
        this.startBtn.addEventListener('click', () => this.startRecording());
        this.stopBtn.addEventListener('click', () => this.stopRecording());
        
        // Audio player events
        this.audioPlayer.addEventListener('ended', () => {
          setTimeout(() => this.hideAudioPlayer(), 2000);
        });
        
        this.audioPlayer.addEventListener('error', () => {
          this.updateStatus("❌ Erreur lors de la lecture audio", "error");
        });

        // Interactive feedback
        this.startBtn.addEventListener('mouseenter', () => {
          if (!this.startBtn.disabled) {
            this.updateStatus("🎙️ Cliquez pour commencer votre consultation");
          }
        });

        this.stopBtn.addEventListener('mouseenter', () => {
          if (!this.stopBtn.disabled) {
            this.updateStatus("⏹️ Cliquez pour terminer votre message");
          }
        });

        // Keyboard accessibility
        document.addEventListener('keydown', (e) => {
          if (e.code === 'Space' && e.target === document.body) {
            e.preventDefault();
            if (!this.startBtn.disabled) {
              this.startRecording();
            } else if (!this.stopBtn.disabled) {
              this.stopRecording();
            }
          }
        });
      }

      initParticles() {
        const particles = document.getElementById('particles');
        const particleCount = 15;
        
        for (let i = 0; i < particleCount; i++) {
          setTimeout(() => {
            this.createParticle(particles);
          }, i * 800);
        }

        // Continue creating particles
        setInterval(() => {
          this.createParticle(particles);
        }, 2000);
      }

      createParticle(container) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 6 + 2;
        const startX = Math.random() * window.innerWidth;
        const duration = Math.random() * 3 + 5;
        
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = startX + 'px';
        particle.style.animationDuration = duration + 's';
        
        container.appendChild(particle);
        
        setTimeout(() => {
          if (particle.parentNode) {
            particle.parentNode.removeChild(particle);
          }
        }, duration * 1000);
      }

      async checkConnection() {
        try {
          // Test connection by making a simple HEAD request
          const response = await fetch("http://localhost:8000/health", {
            method: "HEAD",
            cache: "no-store"
          });
          
          this.isConnected = response.ok;
        } catch (error) {
          this.isConnected = false;
        }
        
        this.updateConnectionStatus();
        
        // Check connection every 30 seconds
        setTimeout(() => this.checkConnection(), 30000);
      }

      updateConnectionStatus() {
        if (this.isConnected) {
          this.connectionDot.classList.remove('offline');
          this.connectionText.textContent = 'Connecté au serveur';
        } else {
          this.connectionDot.classList.add('offline');
          /// this.connectionText.textContent = 'Hors ligne';
          this.updateStatus("Connexion en cours");
        }
      }

      updateStatus(message, type = '') {
        this.statusElement.textContent = message;
        this.statusElement.className = `status ${type}`;
        
        // Add loading dots for processing state
        if (type === 'processing') {
          const loadingHTML = message + ' <span class="loading-dots"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span>';
          this.statusElement.innerHTML = loadingHTML;
        }
      }

      showAudioPlayer() {
        this.audioSection.classList.add('visible');
      }

      hideAudioPlayer() {
        this.audioSection.classList.remove('visible');
      }

      async startRecording() {
        if (this.isRecording) return;
        
        try {
          this.hideAudioPlayer();
          
          // Check microphone permissions
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("L'accès au microphone n'est pas disponible");
          }
          
          this.audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.mediaRecorder = new MediaRecorder(this.audioStream);
          this.audioChunks = [];

          this.mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) this.audioChunks.push(event.data);
          };

          this.mediaRecorder.onstop = async () => {
            this.recordingIndicator.classList.remove('active');
            this.waveAnimation.classList.remove('active');
            
            const audioBlob = new Blob(this.audioChunks, { type: "audio/wav" });
            await this.processAudio(audioBlob);
          };

          this.mediaRecorder.onerror = (event) => {
            console.error("Erreur d'enregistrement:", event.error);
            this.updateStatus("❌ Erreur lors de l'enregistrement", "error");
            this.stopRecording();
          };

          // Start recording
          this.mediaRecorder.start(100); // Collect data every 100ms
          this.isRecording = true;
          
          // Update UI
          this.startBtn.disabled = true;
          this.stopBtn.disabled = false;
          this.recordingIndicator.classList.add('active');
          this.waveAnimation.classList.add('active');
          this.updateStatus("🎤 Enregistrement en cours... Parlez maintenant", "recording");
          
        } catch (error) {
          console.error("Erreur lors du démarrage de l'enregistrement:", error);
          this.updateStatus(`❌ Erreur: ${error.message}`, "error");
          this.stopRecording();
        }
      }

      async stopRecording() {
        if (!this.isRecording) return;
        
        try {
          if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
            this.mediaRecorder.stop();
          }
          
          if (this.audioStream) {
            this.audioStream.getTracks().forEach(track => track.stop());
            this.audioStream = null;
          }
          
          this.isRecording = false;
          this.startBtn.disabled = false;
          this.stopBtn.disabled = true;
          
        } catch (error) {
          console.error("Erreur lors de l'arrêt de l'enregistrement:", error);
          this.updateStatus("❌ Erreur lors de l'arrêt de l'enregistrement", "error");
        }
      }

      async  processAudio(audioBlob) {

        if (!this.isConnected) {
            this.updateStatus("l'audio a ete envoye");
            return;
        }

        this.updateStatus("⏳ Traitement...", "processing");

        try {
            const formData = new FormData();
            formData.append("file", audioBlob, "input.wav");

            const response = await fetch("http://localhost:8000/chatbot/voice", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Erreur serveur: ${response.status}`);
            }

            const responseData = await response.json();
            
            if (responseData.audio_url) {
                // Construire l'URL complète
                const audioUrl = `http://localhost:8000${responseData.audio_url}`;
                
                // Nouvelle approche pour la lecture automatique
                const audio = new Audio(audioUrl);
                audio.preload = "auto";
                
                // Gestion des promesses pour la lecture
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        // Audio joué avec succès
                        this.audioPlayer.src = audioUrl;
                        this.showAudioPlayer();
                        this.updateStatus("✅ Consultation terminée - Lecture en cours", "success");
                    })
                    .catch(error => {
                        // Fallback: afficher le player normal avec message
                        console.error("Lecture auto bloquée:", error);
                        this.audioPlayer.src = audioUrl;
                        this.showAudioPlayer();
                        this.updateStatus("✅ Consultation terminée - Cliquez pour écouter", "success");
                    });
                }
            } else if (responseData.error) {
                throw new Error(responseData.error);
            } else {
                throw new Error("Réponse du serveur invalide");
            }
        } catch (error) {
            console.error("Erreur lors du traitement audio:", error);
            this.updateStatus(`❌ Erreur: ${error.message}`, "error");
        }
      }
    }

    // Initialize the application when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new MedBotVoiceInterface();
    });
  </script>
</body>
</html>
